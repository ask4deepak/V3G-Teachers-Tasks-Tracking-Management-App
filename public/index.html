<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Teacher Task, Workflow, Performance & Administration Web Application" />
  <title>Teacher Task Tracking & Administration System</title>
  
  <!-- Modern Typography (Inter & Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  
  <!-- FontAwesome Icons for clean UI cues -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-light">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Global Modal Container -->
  <div id="modal-container" class="modal-backdrop hidden">
    <div id="modal-content" class="modal-card"></div>
  </div>

  <!-- AUTH / LOGIN VIEW -->
  <div id="view-login" class="login-wrapper hidden">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-badge"><i class="fa-solid fa-graduation-cap"></i></div>
        <h1>TaskTrack Pro</h1>
        <p class="subtitle">Teacher Task, Workflow & Performance Portal</p>
      </div>

      <form id="form-login" class="login-form">
        <div class="form-group">
          <label for="login-email"><i class="fa-regular fa-envelope"></i> Institutional Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="e.g. ask4deepak@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="login-password"><i class="fa-solid fa-key"></i> Institutional PIN (IPIN)</label>
          <input type="password" id="login-password" class="form-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="4-6 digit numeric PIN (e.g. 123456)" required />
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-block">
          <span>Sign In with IPIN</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="app-shell" class="app-container hidden">
    
    <!-- Mobile Navigation Backdrop -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-box">
          <div class="brand-logo-sq">TT</div>
          <div class="brand-text">
            <span class="brand-name">TaskTrack</span>
            <span class="brand-sub">Teacher operations</span>
          </div>
        </div>
        <button id="btn-close-sidebar" class="btn-icon mobile-only" aria-label="Close Navigation">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="user-profile-badge">
        <div class="user-avatar" id="nav-user-avatar">DG</div>
        <div class="user-meta">
          <div class="user-name" id="nav-user-name">Deepak Gupta</div>
          <div class="user-role-tag" id="nav-user-role">Super Administrator</div>
        </div>
      </div>

      <!-- Navigation Links Container -->
      <nav id="sidebar-nav" class="nav-menu"></nav>

      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-outline btn-block text-danger">
          <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      
      <!-- Top Header Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-toggle-sidebar" class="btn-icon mobile-only" aria-label="Toggle Sidebar">
            <i class="fa-solid fa-bars"></i>
          </button>
          
          <!-- Hidden Page Title for Accessibility & Screen Readers -->
          <span id="page-title" class="hidden">Dashboard</span>

          <!-- Modern Active Campus Selector Widget -->
          <div class="campus-selector-widget" id="campus-selector-widget">
            <span class="campus-label">Active campus</span>
            <div class="campus-select-wrapper">
              <button type="button" class="campus-dropdown-trigger" id="btn-campus-dropdown" aria-haspopup="listbox" aria-expanded="false">
                <span id="page-campus-scope" class="campus-name-current">All Campuses</span>
                <i class="fa-solid fa-chevron-down campus-chevron"></i>
              </button>
              <div id="campus-dropdown-menu" class="campus-dropdown-menu hidden" role="listbox">
                <!-- Injected via JavaScript -->
              </div>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Operational Date Indicator -->
          <div class="operational-date-badge hide-sm" id="operational-date-display">
            <span class="date-label">Operational date</span>
            <span class="date-value" id="topbar-current-date">--/--/----</span>
          </div>

          <!-- Test SMTP Configuration Button -->
          <button id="btn-topbar-test-smtp" class="btn btn-secondary btn-sm" onclick="openTestEmailModal()" title="Test SMTP Configuration" style="margin-right:6px; display:inline-flex; align-items:center; gap:6px;">
            <i class="fa-solid fa-paper-plane"></i> <span class="hide-sm">Test SMTP</span>
          </button>

          <!-- Refresh Action on Every Main Screen -->
          <button id="btn-refresh" class="btn btn-refresh" title="Refresh Screen Data">
            <i class="fa-solid fa-rotate"></i> <span>Refresh</span>
          </button>

          <div class="theme-toggle" id="theme-toggle" title="Toggle Dark/Light Mode">
            <i class="fa-solid fa-moon"></i>
          </div>
        </div>
      </header>

      <!-- View Container Dynamic Injector -->
      <section id="main-content" class="content-body" tabindex="-1"></section>

    </main>
  </div>

  <!-- Client Application Script -->
  <script src="app.js?v=2.0.2"></script>
</body>
</html>
